<nav class="flex items-center gap-1.5 sm:gap-3 text-[#17171780] text-sm flex-wrap">
  <button type="button" (click)="goBack()" aria-label="Go back" title="Go back"
    class="hover:text-[#171717] hover:scale-105 transition-transform duration-300 ease-in shrink-0">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.5 15.8332L6.66667 9.99984L12.5 4.1665" stroke="#171717" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>

  @if (categoryName()) {
  <a [routerLink]="['/shop']" [queryParams]="{ category: categorySlug() }"
    class="text-[#374151] hover:text-[#171717] transition-colors duration-150 truncate max-w-[10ch] sm:max-w-none">
    {{ categoryName() }}
  </a>
  }

  @if (subCategoryName()) {
  <span class="shrink-0">›</span>
  <a [routerLink]="['/shop']" [queryParams]="{ category: categorySlug() }"
    class="text-[#374151] hover:text-[#171717] transition-colors duration-150 truncate max-w-[10ch] sm:max-w-none">
    {{ subCategoryName() }}
  </a>
  }

  @if (productName()) {
  <span class="shrink-0">›</span>
  <span class="text-[#171717] truncate max-w-[12ch] sm:max-w-none">{{ productName() }}</span>
  }
</nav>
