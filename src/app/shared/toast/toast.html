<div class="toast-wrapper">
  @for (toast of toasts$ | async; track toast.id) {
  <div [@fadeInOut]
    class="toast flex items-center justify-between gap-4 rounded-2xl p-4 shadow-lg transition-all duration-300 hover:shadow-xl border"
    [class.border-green-400]="toast.type === 'success'" [class.bg-green-100]="toast.type === 'success'"
    [class.border-red-400]="toast.type === 'error'" [class.bg-red-100]="toast.type === 'error'">

    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-full shrink-0 border"
        [class.border-green-600]="toast.type === 'success'" [class.border-red-600]="toast.type === 'error'">

        @if (toast.type === 'success') {
        <svg class="w-5 h-5 text-green-600" fill="none" viewBox="0 0 24 24">
          <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        }

        @if (toast.type === 'error') {
        <svg class="w-5 h-5 text-red-600" fill="none" viewBox="0 0 24 24">
          <path
            d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18C1.64 18.3 1.55 18.65 1.55 19C1.55 20.1 2.43 21 3.53 21H20.47C21.57 21 22.45 20.1 22.45 19C22.45 18.65 22.35 18.3 22.18 18L13.71 3.86C13.53 3.57 13.28 3.32 12.98 3.15C12.68 2.98 12.34 2.9 12 2.9C11.66 2.9 11.32 2.98 11.02 3.15C10.72 3.32 10.47 3.57 10.29 3.86Z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        }
      </div>

      <div>
        <p class="font-semibold text-gray-900">
          {{ toast.type === 'success' ? 'Success' : 'Error' }}
        </p>
        <p class="text-sm text-gray-600">
          {{ toast.message }}
        </p>
      </div>
    </div>

    <button (click)="dismiss(toast.id)"
      class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition-all duration-200 hover:bg-gray-100 hover:text-gray-700 shrink-0">

      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

  </div>
  }
</div>
