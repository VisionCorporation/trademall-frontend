@if (dialogService.isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4" (click)="dialogService.handleCancel()"
    [@fadeInOut]>
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl" (click)="$event.stopPropagation()">
        <div class="flex items-start justify-between gap-4 mb-3">
            <h3 class="text-lg font-medium text-[#171717] products-font">
                {{ dialogService.options().title ?? 'Are you sure?' }}
            </h3>

            <button type="button" aria-label="Close dialog" (click)="dialogService.handleCancel()"
                class="-mt-1 -mr-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[#6B7280] transition-colors hover:bg-[#F4F4F4] hover:text-[#171717] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#00A751]">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
        </div>

        <p class="text-sm text-[#6B7280] mb-6">
            {{ dialogService.options().message }}
        </p>

        <div class="flex items-center justify-end gap-3">
            <button type="button" (click)="dialogService.handleCancel()"
                class="px-4 py-2.5 rounded-xl text-[14px] font-medium text-[#171717] hover:bg-[#F4F4F4] transition-colors">
                {{ dialogService.options().cancelLabel ?? 'Cancel' }}
            </button>

            <button type="button" (click)="dialogService.handleConfirm()"
                class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-[14px] font-medium text-white transition-colors"
                [class]="dialogService.options().variant === 'danger'
            ? 'bg-[#EF4444] hover:bg-[#DC2626]'
            : 'bg-[#171717] hover:opacity-85'">
                @if (dialogService.options().variant === 'danger') {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <path d="M5 6l1 14h12l1-14" />
                    <path d="M10 11v6M14 11v6" />
                </svg>
                }

                {{ dialogService.options().confirmLabel ?? 'Confirm' }}
            </button>
        </div>
    </div>
</div>
}
