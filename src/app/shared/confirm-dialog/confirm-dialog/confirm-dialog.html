@if (dialogService.isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs px-4"
    (click)="dialogService.handleCancel()">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl" (click)="$event.stopPropagation()">
        <h3 class="text-lg font-medium text-[#171717] mb-2 products-font">{{ dialogService.options().title ?? 'Are you sure?' }}
        </h3>
        <p class="text-sm text-[#6B7280] mb-6">{{ dialogService.options().message }}</p>
        <div class="flex items-center justify-end gap-3">
            <button type="button" (click)="dialogService.handleCancel()"
                class="px-4 py-2.5 rounded-xl text-[14px] font-medium text-[#171717] hover:bg-[#F4F4F4] transition-colors">
                {{ dialogService.options().cancelLabel ?? 'Cancel' }}
            </button>
            <button type="button" (click)="dialogService.handleConfirm()"
                class="px-4 py-2.5 rounded-xl text-[14px] font-medium text-white transition-colors"
                [class]="dialogService.options().variant === 'danger' ? 'bg-[#EF4444] hover:bg-[#DC2626]' : 'bg-[#171717] hover:opacity-85'">
                {{ dialogService.options().confirmLabel ?? 'Confirm' }}
            </button>
        </div>
    </div>
</div>
}
