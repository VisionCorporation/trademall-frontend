<div class="max-w-350 mx-auto pt-20 md:pt-24">
    <app-header />
    <div class="px-5 md:px-12 2xl:px-0">
        @if (true) {
        <div class="flex flex-col items-center justify-center text-center py-16 md:py-24 rounded-2xl">
            <div class="w-44 h-44 rounded-full flex items-center justify-center mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-map-pin-off-icon lucide-map-pin-off w-24 h-24 text-[#17171780]">
                    <path d="M12.75 7.09a3 3 0 0 1 2.16 2.16" />
                    <path
                        d="M17.072 17.072c-1.634 2.17-3.527 3.912-4.471 4.727a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 1.432-4.568" />
                    <path d="m2 2 20 20" />
                    <path d="M8.475 2.818A8 8 0 0 1 20 10c0 1.183-.31 2.377-.81 3.533" />
                    <path d="M9.13 9.13a3 3 0 0 0 3.74 3.74" />
                </svg>
            </div>

            <h2 class="text-[36px] sm:text-[52px]">No delivery address set</h2>
            <p class="text-[#17171780] sm:text-lg mt-1.5">
                Add a delivery address so we know where to send your orders.
            </p>

            <button
                class="mt-6 inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-gray-900 text-white text-sm font-medium hover:bg-gray-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Add Address
            </button>
        </div>
        } @else {
        <!-- Address details view goes here -->
        }
    </div>
</div>

<app-footer />
