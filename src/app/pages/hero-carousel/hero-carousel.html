<section class="page-hero relative w-full h-dvh overflow-hidden">
    @for (slide of slides; track slide.title; let i = $index) {
    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
        [class]="currentIndex === i ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'">
        <img [ngSrc]="slide.image" [alt]="slide.title" fill priority="{{ i === 0 }}" class="object-cover object-top" />
        <div class="absolute inset-0"
            style="background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.5) 100%)">
        </div>

        <div
            class="relative z-10 h-full flex items-center justify-center text-center px-6 sm:px-12 lg:px-20 max-w-310 mx-auto">
            <div>
                <span
                    class="inline-flex items-center rounded-full bg-white/15 border border-white/25 px-3 py-1 sm:px-4 sm:py-1.5 text-[10px] sm:text-[11px] font-semibold uppercase tracking-[0.2em] sm:tracking-[0.25em] text-white/95 mb-4 sm:mb-5">
                    Your Trusted Multi-Vendor Marketplace
                </span>

                <h1
                    class="text-white text-4xl md:text-6xl lg:text-8xl uppercase leading-tight text-balance">
                    {{ slide.title }}
                </h1>

                <p class="text-white/80 max-w-127.5 mx-auto text-lg sm:text-xl mt-4">
                    {{ slide.subtitle }}
                </p>

                <a [routerLink]="slide.ctaLink"
                    class="inline-flex items-center gap-2 text-[15px] sm:text-[16px] px-6 py-3.5 bg-white hover:opacity-90 transition-opacity duration-150 ease-in text-[#171717] rounded-lg mt-8">
                    {{ slide.ctaLabel }}
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
    }

    <button (click)="prev(); restartAutoplay()"
        class="hidden absolute z-20 left-4 sm:left-6 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/30 backdrop-blur-sm w-10 h-10 rounded-full sm:flex items-center justify-center transition-colors duration-200 cursor-pointer"
        aria-label="Previous slide">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.5 15.8332L6.66667 9.99984L12.5 4.1665" stroke="white" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <button (click)="next(); restartAutoplay()"
        class="hidden absolute z-20 right-4 sm:right-6 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/30 backdrop-blur-sm w-10 h-10 rounded-full sm:flex items-center justify-center transition-colors duration-200 cursor-pointer"
        aria-label="Next slide">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 4.1665L13.3333 9.99984L7.5 15.8332" stroke="white" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <div class="absolute z-20 bottom-30 left-1/2 -translate-x-1/2 flex items-center gap-2">
        @for (slide of slides; track slide.title; let i = $index) {
        <button (click)="goTo(i)" class="h-2 rounded-full transition-all duration-300 cursor-pointer"
            [class]="currentIndex === i ? 'w-8 bg-white' : 'w-2 bg-white/50 hover:bg-white/75'"
            [attr.aria-label]="'Go to slide ' + (i + 1)">
        </button>
        }
    </div>
</section>
