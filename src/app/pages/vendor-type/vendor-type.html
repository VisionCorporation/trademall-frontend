<main>
  <section class="relative bg-[#E3E8E1] min-h-screen overflow-hidden py-10 md:py-16 px-5 md:px-12 lg:px-20 xl:px-32">
    <div class="absolute inset-0 opacity-[0.07] pointer-events-none"
      style="background-image: radial-gradient(#171717 1.5px, transparent 1.5px); background-size: 28px 28px;">
    </div>

    <a routerLink="/" class="inline-block">
      <img ngSrc="assets/images/logo-black.png" title="logo" width="566" height="171" priority alt="logo"
        class="w-20 md:w-24 h-auto mb-10 md:mb-14 relative z-10" />
    </a>

    <div class="relative z-10 max-w-4xl">
      <span class="inline-block text-xs sm:text-sm tracking-[0.2em] uppercase text-[#00a751] font-medium mb-4">
        Sell on Trademall
      </span>
      <h1 class="text-[36px] md:text-[48px] lg:text-[56px] leading-[1.05] mb-3 text-[#171717] products-font">
        Welcome to trademall
      </h1>
      <p class="text-[17px] md:text-[20px] text-[#374151] mb-10">
        Select a vendor type to continue
      </p>

      <form [formGroup]="vendorTypeForm" (ngSubmit)="registerVendor()" class="flex flex-col gap-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-5 max-w-2xl">
          @for (vendorType of vendorTypes; track vendorType.value) {
          <label [for]="vendorType.value"
            class="relative bg-white rounded-2xl p-6 md:p-7 cursor-pointer border-2 transition-all duration-200 flex flex-col gap-4"
            [class]="vendorTypeForm.get('vendorType')?.value === vendorType.value
            ? 'border-[#00a751] shadow-md'
            : 'border-transparent hover:border-[#17171733]'">

            <input type="radio" formControlName="vendorType" [value]="vendorType.value" [id]="vendorType.value"
              class="sr-only" />

            <div class="flex items-center justify-between">
              <div
                class="w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center transition-colors duration-200"
                [class]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'bg-[#00a751]' : 'bg-[#F7F7F7]'">
                @if (vendorType.value === 'business') {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M3 9L4.5 4.5H19.5L21 9M3 9C3 10.1046 3.89543 11 5 11C6.10457 11 7 10.1046 7 9C7 10.1046 7.89543 11 9 11C10.1046 11 11 10.1046 11 9C11 10.1046 11.8954 11 13 11C14.1046 11 15 10.1046 15 9C15 10.1046 15.8954 11 17 11C18.1046 11 19 10.1046 19 9C19 10.1046 19.8954 11 21 11C21 9 21 9 21 9M4 11V18.5C4 19.0523 4.44772 19.5 5 19.5H19C19.5523 19.5 20 19.0523 20 18.5V11"
                    [attr.stroke]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'white' : '#171717'"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M9 19.5V15C9 14.4477 9.44772 14 10 14H14C14.5523 14 15 14.4477 15 15V19.5"
                    [attr.stroke]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'white' : '#171717'"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                } @else {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="4"
                    [attr.stroke]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'white' : '#171717'"
                    stroke-width="1.5" />
                  <path d="M4 20.5C4 16.634 7.58172 13.5 12 13.5C16.4183 13.5 20 16.634 20 20.5"
                    [attr.stroke]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'white' : '#171717'"
                    stroke-width="1.5" stroke-linecap="round" />
                </svg>
                }
              </div>

              <div
                class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors duration-200"
                [class]="vendorTypeForm.get('vendorType')?.value === vendorType.value ? 'border-[#00a751] bg-[#00a751]' : 'border-[#17171733]'">
                @if (vendorTypeForm.get('vendorType')?.value === vendorType.value) {
                <svg width="12" height="12" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 10L8 14L16 6" stroke="white" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                }
              </div>
            </div>

            <div>
              <h2 class="text-[20px] md:text-[22px] products-font text-[#171717] mb-1">{{ vendorType.name }}</h2>
              <p class="text-sm text-[#6B7280] leading-relaxed">
                {{ vendorType.description }}
              </p>
            </div>
          </label>
          }
        </div>

        <div class="max-w-2xl">
          <button type="submit"
            [disabled]="vendorTypeForm.get('vendorType')?.value === '' || (signupService.isSubmitting$ | async)"
            class="w-full sm:w-auto flex items-center justify-center gap-2.5 text-[15px] md:text-[16px] font-medium bg-[#171717] hover:opacity-85 transition-opacity duration-200 ease-in px-8 py-3.5 text-white rounded-xl disabled:cursor-not-allowed disabled:opacity-50"
            [class.cursor-not-allowed]="vendorTypeForm.get('vendorType')?.value === ''">
            @if (signupService.isSubmitting$ | async) {
            <div class="loader"></div>
            }
            {{ (signupService.isSubmitting$ | async) ? 'Creating Account...' : 'Create an account' }}
            @if (!(signupService.isSubmitting$ | async)) {
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.5 4.1665L13.3333 9.99984L7.5 15.8332" stroke="white" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            }
          </button>
        </div>
      </form>
    </div>

    <p
      class="mt-10 lg:mt-0 relative z-10 lg:absolute lg:top-10 text-center lg:right-12 xl:right-20 text-[15px] md:text-lg">
      Already have an account?
      <a class="text-[#00a751] font-medium hover:underline" routerLink="/login">Log In</a>
    </p>
  </section>
</main>
